openapi: 3.1.0
info:
  title: (title)
  version: 0.0.0
tags: []
paths:
  /bookings:
    get:
      operationId: Bookings_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
    post:
      operationId: Bookings_create
      description: Guest books a free slot for a chosen event type. Fails with 409 if the slot is no longer available.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotAlreadyBookedError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBooking'
  /bookings/{id}:
    get:
      operationId: Bookings_get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
  /event-types:
    get:
      operationId: EventTypes_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
    post:
      operationId: EventTypes_create
      description: Owner creates a new event type that guests can book.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventType'
  /event-types/{eventTypeId}/slots:
    get:
      operationId: Slots_list
      parameters:
        - name: eventTypeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
  /event-types/{id}:
    get:
      operationId: EventTypes_get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
  /owner:
    get:
      operationId: Owner_get
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarOwner'
components:
  schemas:
    Booking:
      type: object
      required:
        - id
        - eventTypeId
        - slotId
        - guest
        - createdAt
      properties:
        id:
          type: string
        eventTypeId:
          type: string
        slotId:
          type: string
        guest:
          $ref: '#/components/schemas/Guest'
        createdAt:
          type: string
          format: date-time
    CalendarOwner:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
    CreateBooking:
      type: object
      required:
        - eventTypeId
        - slotId
        - guest
      properties:
        eventTypeId:
          type: string
        slotId:
          type: string
        guest:
          $ref: '#/components/schemas/Guest'
    CreateEventType:
      type: object
      required:
        - name
        - description
        - durationMinutes
      properties:
        name:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
    EventType:
      type: object
      required:
        - id
        - name
        - description
        - durationMinutes
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
    Guest:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
    Slot:
      type: object
      required:
        - id
        - eventTypeId
        - startTime
        - endTime
        - status
      properties:
        id:
          type: string
        eventTypeId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SlotStatus'
      description: A bookable time slot for an event type. Slots are generated for the next 14 days from today.
    SlotAlreadyBookedError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    SlotStatus:
      type: string
      enum:
        - Available
        - Booked
